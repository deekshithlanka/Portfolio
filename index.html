<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deekshith Lanka · AI Product Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Fredoka:wght@600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
@property --w { syntax: '<length>'; inherits: true; initial-value: 0px; }
@property --h { syntax: '<length>'; inherits: true; initial-value: 0px; }
@property --d { syntax: '<length>'; inherits: true; initial-value: 0px; }

:root{
  --ease: cubic-bezier(.55,0,.25,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --display: 'Bricolage Grotesque', 'Clash Display', system-ui, sans-serif;
  --body: 'Figtree', 'Cabinet Grotesk', system-ui, sans-serif;
  --serif: 'Instrument Serif', Georgia, serif;
  --pad: 48px;
  --t: 0ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:var(--body);color:#fff;
  background:linear-gradient(180deg,#0f74e0 0%,#1f93f2 55%,#46b8ff 100%);
  min-height:100svh;display:flex;flex-direction:column;overflow:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:44px 44px;
}

/* ---------- nav ---------- */
nav{
  position:relative;z-index:500;height:72px;flex:none;
  display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);
}
.logo{
  font-family:'Fredoka',var(--body);font-weight:700;font-size:30px;letter-spacing:-.02em;
  color:#fff;text-decoration:none;width:auto;min-width:112px;line-height:1;
  text-shadow:0 3px 0 rgba(10,60,150,.25);
}
.logo span{color:#ffd23f}
.links{display:flex;gap:30px}
.links button{
  all:unset;cursor:pointer;font-family:var(--body);font-weight:700;font-size:15px;color:#e6f3ff;
  padding:6px 2px;border-bottom:2px solid transparent;transition:border-color .2s,color .2s;
}
.links button:hover,.links button:focus-visible{color:#fff;border-color:#ffd23f}
.talk{
  font-family:var(--display);font-weight:700;font-size:18px;color:#fff;text-decoration:none;
  letter-spacing:-.01em;
}
.talk:hover{color:#ffd23f}

/* ---------- stage ---------- */
.stage{position:relative;flex:1;min-height:560px;overflow:hidden}
.backdrop{
  position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);
  font-family:var(--display);font-weight:800;font-size:clamp(90px,19vw,330px);
  letter-spacing:-.04em;line-height:1;color:#fff;white-space:nowrap;pointer-events:none;user-select:none;
}
.depot{
  position:absolute;top:52px;left:var(--pad);z-index:5;font-size:11px;font-weight:700;
  letter-spacing:.22em;color:#d7ecff;
}
.depot b{color:#ffd23f;font-weight:800}
.hint{
  position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:400;
  padding:9px 18px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.18em;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;
}

/* ---------- rail + claw ---------- */
.rail{
  position:absolute;left:0;right:0;top:20px;height:16px;z-index:300;
  background:linear-gradient(180deg,#fff 0%,#e9eef5 55%,#c5cfdc 100%);
  box-shadow:0 6px 18px rgba(6,50,130,.35);
}
.rail::after{
  content:"";position:absolute;left:0;right:0;top:7px;border-top:2px dashed rgba(90,110,140,.28);
}
.claw{position:absolute;top:0;left:0;width:0;height:0;z-index:310;transition:left var(--t) var(--ease)}
.carriage{
  position:absolute;top:12px;left:-34px;width:68px;height:34px;border-radius:12px;
  background:linear-gradient(180deg,#fff,#dfe6ef);box-shadow:0 4px 10px rgba(6,50,130,.3),inset 0 -3px 0 rgba(0,0,0,.06);
}
.carriage::before,.carriage::after{
  content:"";position:absolute;top:7px;width:9px;height:9px;border-radius:50%;background:#9fb0c6;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.35);
}
.carriage::before{left:11px}.carriage::after{right:11px}
.rod{
  position:absolute;top:44px;left:-4px;width:8px;height:30px;
  background:linear-gradient(90deg,#a9b3c0,#fff 50%,#a9b3c0);
  transition:height var(--t) var(--ease);
}
.head{
  position:absolute;top:74px;left:-36px;width:72px;height:34px;border-radius:12px;
  background:linear-gradient(180deg,#fff,#dbe3ed);box-shadow:0 6px 14px rgba(6,50,130,.35),inset 0 -3px 0 rgba(0,0,0,.06);
  transition:top var(--t) var(--ease);
}
.finger{
  position:absolute;top:24px;height:80px;width:160px;
  transition:width var(--t) var(--ease),height var(--t) var(--ease),transform .38s var(--spring);
}
.finger.l{right:50%;transform-origin:100% 0}
.finger.r{left:50%;transform-origin:0 0}
.finger::before{ /* arm */
  content:"";position:absolute;top:0;left:0;right:0;height:11px;border-radius:6px;
  background:linear-gradient(180deg,#fff,#d6dee9);box-shadow:0 3px 8px rgba(6,50,130,.3);
}
.finger::after{ /* hanging finger */
  content:"";position:absolute;top:0;bottom:0;width:13px;border-radius:6px 6px 8px 8px;
  background:linear-gradient(90deg,#d6dee9,#fff 45%,#d6dee9);box-shadow:0 4px 10px rgba(6,50,130,.3);
}
.finger.l::after{left:0}.finger.r::after{right:0}
.claw.open .finger.l{transform:rotate(16deg)}
.claw.open .finger.r{transform:rotate(-16deg)}

/* ---------- containers ---------- */
.slot{position:absolute;width:0;height:0;transition:left var(--t) var(--ease),top var(--t) var(--ease)}
.lift{position:absolute;left:0;top:0;perspective:1500px;transition:translate .25s var(--ease)}
.slot:not(.held):hover .lift,.slot:not(.held):focus-within .lift{translate:0 -10px}
.box{
  position:absolute;width:var(--w);height:var(--h);
  left:calc(var(--w) / -2);top:calc(var(--h) / -2);
  transform-style:preserve-3d;
  transition:transform var(--t) var(--ease),--w var(--t) var(--ease),--h var(--t) var(--ease),--d var(--t) var(--ease);
  --ribs:repeating-linear-gradient(90deg,rgba(255,255,255,.13) 0 3px,rgba(0,0,0,.16) 3px 6px,transparent 6px 11px);
  --dt:.45s;--de:var(--ease);
}
.face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ribbed{background:var(--ribs),var(--c);border:1px solid rgba(0,0,0,.28)}
.back{inset:0;transform:rotateY(180deg) translateZ(calc(var(--d) / 2))}
.end{top:0;height:100%;width:var(--d);left:calc(50% - var(--d) / 2);
  background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(0,0,0,.35) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),var(--ribs),var(--k);
  border:1px solid rgba(0,0,0,.3)}
.end.l{transform:rotateY(-90deg) translateZ(calc(var(--w) / 2))}
.end.r{transform:rotateY(90deg) translateZ(calc(var(--w) / 2))}
.cap{left:0;width:100%;height:var(--d);top:calc(50% - var(--d) / 2)}
.cap.t{transform:rotateX(90deg) translateZ(calc(var(--h) / 2));background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.16)),var(--ribs),var(--c)}
.cap.b{transform:rotateX(-90deg) translateZ(calc(var(--h) / 2));background:var(--k)}

/* inside walls */
.inner{background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 3px,rgba(0,0,0,.2) 3px 6px,transparent 6px 11px),#0c1838}
.in-back{inset:0;transform:translateZ(calc(var(--d) / -2 + 1px));display:flex;align-items:center;justify-content:center;overflow:hidden}
.in-l{top:0;height:100%;width:var(--d);left:calc(50% - var(--d) / 2);transform:rotateY(90deg) translateZ(calc(var(--w) / -2 + 1px));filter:brightness(1.35)}
.in-r{top:0;height:100%;width:var(--d);left:calc(50% - var(--d) / 2);transform:rotateY(-90deg) translateZ(calc(var(--w) / -2 + 1px));filter:brightness(1.35)}
.in-t{left:0;width:100%;height:var(--d);top:calc(50% - var(--d) / 2);transform:rotateX(-90deg) translateZ(calc(var(--h) / -2 + 1px));filter:brightness(.7)}
.in-b{left:0;width:100%;height:var(--d);top:calc(50% - var(--d) / 2);transform:rotateX(90deg) translateZ(calc(var(--h) / -2 + 1px));filter:brightness(1.6)}

/* front + doors */
.front{
  all:unset;position:absolute;inset:0;cursor:pointer;display:block;
  transform-style:preserve-3d;transform:translateZ(calc(var(--d) / 2));
}
.held.opened .front{pointer-events:none;cursor:default}
.door{position:absolute;top:0;width:50%;height:100%;transform-style:preserve-3d;transition:transform var(--dt) var(--de)}
.door.l{left:0;transform-origin:0 50%}
.door.r{right:0;transform-origin:100% 50%}
.opened .door.l{transform:rotateY(-122deg)}
.opened .door.r{transform:rotateY(122deg)}
.door .out{inset:0;overflow:hidden}
.door.l .out{border-right:2px solid var(--k)}
.door.r .out{border-left:2px solid var(--k)}
.door .in{inset:0;transform:rotateY(180deg);background:var(--ribs),var(--k);border:1px solid rgba(0,0,0,.35)}
.label{
  position:absolute;top:0;width:200%;padding:7% 0 0 6%;
  font-family:var(--display);font-weight:800;text-transform:uppercase;color:#fff;
  font-size:calc(var(--h) * .28);line-height:.84;letter-spacing:-.02em;
  text-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap;
}
.door.l .label{left:0}
.door.r .label{left:-100%}
.tag{
  position:absolute;right:8%;bottom:9%;font-size:calc(var(--h) * .075);font-weight:800;
  letter-spacing:.2em;color:rgba(255,255,255,.88);
}
.front:focus-visible .out{outline:3px solid #ffd23f;outline-offset:-7px}

/* content */
.content{
  width:90%;font-size:calc(var(--h) * .058);color:#dbe3ef;line-height:1.4;
  opacity:0;transition:opacity .3s;
}
.opened .content{opacity:1;transition:opacity .5s .2s}
.kicker{font-size:.78em;font-weight:800;letter-spacing:.2em;color:var(--a);margin-bottom:.5em}
.content h2{
  font-family:var(--display);font-weight:700;font-size:2.15em;line-height:1;letter-spacing:-.025em;
  color:#fff;margin-bottom:.4em;outline:none;
}
.content h2 em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--a);letter-spacing:0}
.content p{max-width:46em}
.content ul{list-style:none;display:grid;gap:.32em}
.content li b{color:#fff;font-weight:800}
.content a{color:inherit;text-decoration:none}
.content a:hover b,.content a:focus-visible b{color:var(--a);text-decoration:underline}
.content .num{color:var(--a);font-weight:800;margin-right:.4em}
.chips{display:flex;flex-wrap:wrap;gap:.4em}
.chips span{padding:.3em .85em;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);font-weight:600;font-size:.95em;color:#fff}
.stats{display:flex;gap:1.6em;margin-top:.7em}
.stats div{font-size:.8em;color:#aebbd0}
.stats b{display:block;font-family:var(--display);font-size:1.9em;color:#fff;line-height:1}
.cta{display:inline-block;margin-top:.8em;padding:.55em 1.2em;border-radius:999px;background:var(--a);color:#0c1838 !important;font-weight:800}
.cta:hover{filter:brightness(1.1)}
.sub{margin-top:.6em;font-size:.85em;color:#aebbd0}
.sub a{text-decoration:underline !important}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- phones ---------- */
@media (max-width:700px){
  :root{--pad:14px}
  nav{height:auto;flex-wrap:wrap;padding:12px var(--pad) 6px;row-gap:6px}
  .logo{font-size:25px;min-width:92px}
  .links{order:3;width:100%;justify-content:center;gap:22px}
  .talk{font-size:16px}
  .hint,.depot{display:none}
  .label{font-size:calc(var(--h) * .25)}
  .content{font-size:calc(var(--h) * .058)}
  .content ul .desc{display:none}
  .content ul{gap:.45em}
  .stats{gap:1em}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none !important}
}
</style>
</head>
<body>
<nav aria-label="Main">
  <a class="logo" href="#" aria-label="Deekshith Lanka, home">deekshith<span>.</span></a>
  <div class="links">
    <button type="button" data-go="1">Work</button>
    <button type="button" data-go="2">About</button>
    <button type="button" data-go="3">Process</button>
    <button type="button" data-go="6">Contact</button>
  </div>
  <a class="talk" href="mailto:dlankavenkata@gmail.com">Let's Talk ↗</a>
</nav>

<main class="stage" id="stage">
  <h1 class="sr">Venkata Deekshith Lanka, AI Product Manager. Portfolio.</h1>
  <div class="backdrop" aria-hidden="true">PORTFOLIO</div>
  <div class="depot">DEEKSHITH'S DEPOT · <b>7 CONTAINERS</b> · 2026</div>
  <div class="rail" aria-hidden="true"></div>
  <div class="claw open" id="claw" aria-hidden="true">
    <div class="carriage"></div>
    <div class="rod" id="rod"></div>
    <div class="head" id="head">
      <div class="finger l" id="fl"></div>
      <div class="finger r" id="fr"></div>
    </div>
  </div>
  <div id="pile"></div>
  <div class="hint" aria-hidden="true">PICK A CONTAINER ↓</div>
</main>

<script>
(function(){
const GH = 'https://github.com/deekshithlanka/';
const BOXES = [
  {c:'#e5322d',k:'#a91f1b',a:'#ff7a72',l:['PORT','FOLIO'],tag:'DEEKSHITH',name:'Portfolio',
   html:`<div class="kicker">01 / HELLO</div>
   <h2 tabindex="-1">Hi, I'm <em>Deekshith.</em></h2>
   <p>An AI product manager who turns messy user and business problems into shipped, measurable products, from LLM copilots and RAG search to fraud detection. Every container in the pile holds a piece of my work.</p>`},
  {c:'#f26a1f',k:'#b84a10',a:'#ff9a5c',l:['THE','WORK'],tag:'02',name:'The work',
   html:`<div class="kicker">02 / SELECTED WORK</div>
   <h2 tabindex="-1">The <em>work.</em></h2>
   <ul>
    <li><a href="${GH}rag-eval-framework" target="_blank" rel="noopener"><b>RAG Eval Framework</b><span class="desc"> · LLM judges and a ship-or-not call</span></a></li>
    <li><a href="${GH}Gemini-AI-Chat" target="_blank" rel="noopener"><b>Gemini RAG Assistant</b><span class="desc"> · cited PDF answers, with guardrails</span></a></li>
    <li><a href="${GH}docroute" target="_blank" rel="noopener"><b>DocRoute</b><span class="desc"> · AI invoice intake and approval routing for contractors</span></a></li>
    <li><a href="${GH}Threads-Case-Study" target="_blank" rel="noopener"><b>Threads Case Study</b><span class="desc"> · discovery, RICE and a PRD for feed controls</span></a></li>
    <li><a href="${GH}nfl-trade-value" target="_blank" rel="noopener"><b>NFL Trade Value</b><span class="desc"> · every player scored 0–100 from public data</span></a></li>
   </ul>`},
  {c:'#1d55d8',k:'#123a9c',a:'#7fa6ff',l:['ABOUT','ME'],tag:'03',name:'About me',
   html:`<div class="kicker">03 / ABOUT ME</div>
   <h2 tabindex="-1">A little <em>about</em> me.</h2>
   <p>4+ years leading AI and data products in healthcare and finance at Cigna, Zions Bancorporation and Goldman Sachs. Based in Houston, with an MS in Industrial &amp; Human Factors Engineering.</p>
   <div class="stats">
    <div><b>88%</b>faster document lookup with a RAG copilot</div>
    <div><b>70%</b>WAU within 90 days</div>
    <div><b>$4.2M</b>cost-of-care savings found</div>
   </div>`},
  {c:'#f6b919',k:'#c08a0a',a:'#ffd23f',l:['PRO','CESS'],tag:'04',name:'Process',
   html:`<div class="kicker">04 / PROCESS</div>
   <h2 tabindex="-1">How I <em>build.</em></h2>
   <ul>
    <li><span class="num">01</span><b>Discover</b> · start with users and real evidence</li>
    <li><span class="num">02</span><b>Prioritize</b> · RICE, success metrics and a clear PRD</li>
    <li><span class="num">03</span><b>Ship &amp; measure</b> · launch, A/B test, evaluate, keep improving</li>
   </ul>`},
  {c:'#97a1ad',k:'#6c7682',a:'#cfd6df',l:['TOOL','KIT'],tag:'05',name:'Toolkit',
   html:`<div class="kicker">05 / TOOLKIT</div>
   <h2 tabindex="-1">What's in the <em>box.</em></h2>
   <div class="chips"><span>SQL</span><span>Python</span><span>LangChain</span><span>Gemini</span><span>FAISS</span><span>Databricks</span><span>Snowflake</span><span>PySpark</span><span>Power BI</span><span>Jira</span></div>`},
  {c:'#e5322d',k:'#a91f1b',a:'#ff7a72',l:['WHAT','I DO'],tag:'06',name:'What I do',
   html:`<div class="kicker">06 / WHAT I DO</div>
   <h2 tabindex="-1">What I <em>do.</em></h2>
   <div class="chips"><span>AI product strategy</span><span>RAG &amp; LLM evaluation</span><span>Product discovery</span><span>PRDs &amp; roadmaps</span><span>A/B testing</span><span>Data platforms</span></div>`},
  {c:'#2546b8',k:'#172f80',a:'#8fa9ff',l:['SAY','HELLO'],tag:'07',name:'Say hello',
   html:`<div class="kicker">07 / SAY HELLO</div>
   <h2 tabindex="-1">Got an <em>idea?</em></h2>
   <p>Hiring for an AI product role, building something with LLMs, or just want to say hi?</p>
   <a class="cta" href="mailto:dlankavenkata@gmail.com">dlankavenkata@gmail.com ↗</a>
   <p class="sub">Code on <a href="${GH}" target="_blank" rel="noopener">github.com/deekshithlanka</a></p>`}
];
const POS_D = [[.48,.66,-14,-24,6],[.13,.86,-16,28,16],[.36,.90,-12,-20,-10],[.60,.88,-14,24,12],[.86,.86,-16,-30,-14],[.25,.68,-14,30,-12],[.73,.68,-14,-26,16]];
const POS_M = [[.50,.64],[.17,.91],[.50,.93],[.84,.90],[.20,.77],[.52,.79],[.82,.76]];

const stage = document.getElementById('stage'), pile = document.getElementById('pile');
const claw = document.getElementById('claw'), rod = document.getElementById('rod'), head = document.getElementById('head');
const fl = document.getElementById('fl'), fr = document.getElementById('fr');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

const els = BOXES.map((b,i)=>{
  const slot = document.createElement('div'); slot.className='slot';
  const doorFace = (side)=>`<div class="door ${side}"><div class="face out ribbed"><span class="label">${b.l[0]}<br>${b.l[1]}</span>${side==='r'?`<span class="tag">${b.tag}</span>`:''}</div><div class="face in"></div></div>`;
  slot.innerHTML = `<div class="lift"><div class="box" style="--c:${b.c};--k:${b.k};--a:${b.a}">
    <div class="face back ribbed"></div>
    <div class="face end l"></div><div class="face end r"></div>
    <div class="face cap t"></div><div class="face cap b"></div>
    <div class="face inner in-l"></div><div class="face inner in-r"></div>
    <div class="face inner in-t"></div><div class="face inner in-b"></div>
    <div class="face inner in-back"><div class="content" inert>${b.html}</div></div>
    <button class="front" type="button" aria-label="Open the ${b.name} container">${doorFace('l')}${doorFace('r')}</button>
  </div></div>`;
  pile.appendChild(slot);
  const box = slot.querySelector('.box');
  slot.querySelector('.front').addEventListener('click',()=>pick(i));
  return {slot, box, content:slot.querySelector('.content'), h2:slot.querySelector('h2')};
});

let G = {}, held = null, busy = false, pending = null, clawState = null;
const HOME_Y = 112, LIFT_Y = 104;

function measure(){
  const r = stage.getBoundingClientRect();
  const mobile = innerWidth <= 700;
  const W = mobile ? Math.min(170, r.width*.38) : Math.max(200, Math.min(310, r.width*.20));
  G = {SW:r.width, SH:r.height, mobile, W, H: W*(mobile?.6:.43), D: W*(mobile?.56:.4), S: mobile?2.4:1.95};
}
function pileState(i){
  const p = G.mobile ? [...POS_M[i], POS_D[i][2]*.8, POS_D[i][3]*.8, POS_D[i][4]*.7] : POS_D[i];
  return {x:p[0]*G.SW, y:p[1]*G.SH, rx:p[2], ry:p[3], rz:p[4], w:G.W, h:G.H, d:G.D, z:Math.round(p[1]*100)};
}
function liftState(){
  const w=G.W*G.S, h=G.H*G.S, d=G.D*G.S;
  return {x:G.SW/2, y:LIFT_Y + h*.53, rx:-7, ry:-11, rz:0, w, h, d, z:200};
}
function applyBox(i, s){
  const e = els[i];
  e.slot.style.left = s.x+'px'; e.slot.style.top = s.y+'px';
  e.box.style.setProperty('--w', s.w+'px'); e.box.style.setProperty('--h', s.h+'px'); e.box.style.setProperty('--d', s.d+'px');
  e.box.style.transform = `rotateX(${s.rx}deg) rotateY(${s.ry}deg) rotateZ(${s.rz}deg)`;
}
function setZ(i, z){ els[i].slot.style.zIndex = z; }
const grabY = s => s.y - s.h*.56;
function setClaw(c){
  clawState = c;
  claw.style.left = c.x+'px';
  const rodLen = Math.max(12, c.Y - 78);
  rod.style.height = rodLen+'px'; head.style.top = (44+rodLen)+'px';
  const half = c.span/2 + 7, len = c.h*.62 + 22;
  [fl,fr].forEach(f=>{ f.style.width = half+'px'; f.style.height = len+'px'; });
  claw.classList.toggle('open', c.open);
}
function clawFor(s, Y, open){ return {x:s.x, Y, span:s.w*1.06, h:s.h, open}; }
function setT(ms){ stage.style.setProperty('--t', (reduce.matches?0:ms)+'ms'); }
const wait = ms => new Promise(r=>setTimeout(r, reduce.matches ? 20 : ms));
function setOpen(i, open){
  const e = els[i];
  e.box.style.setProperty('--dt', open?'.75s':'.45s');
  e.box.style.setProperty('--de', open?'var(--spring)':'var(--ease)');
  e.slot.classList.toggle('opened', open);
  e.content.inert = !open;
}

async function run(i){
  busy = true;
  if (held !== null && held !== i){
    const h = held;
    setOpen(h, false); await wait(450);
    setT(850); const ps = pileState(h); applyBox(h, ps); setClaw(clawFor(ps, grabY(ps), false)); await wait(850);
    setT(240); setClaw({...clawState, open:true}); await wait(240);
    els[h].slot.classList.remove('held'); setZ(h, ps.z); held = null;
  }
  if (held !== i){
    const ps = pileState(i);
    setT(750); setClaw(clawFor(ps, HOME_Y, true)); await wait(750);
    setT(560); setClaw(clawFor(ps, grabY(ps), true)); await wait(560);
    setT(240); setClaw(clawFor(ps, grabY(ps), false)); await wait(240);
    held = i; els[i].slot.classList.add('held'); setZ(i, 200);
    setT(950); const ls = liftState(); applyBox(i, ls); setClaw(clawFor(ls, LIFT_Y, false)); await wait(950);
    setOpen(i, true); await wait(750);
  }
  els[i].h2.focus({preventScroll:true});
  busy = false;
  if (pending !== null){ const p = pending; pending = null; pick(p); }
}
function pick(i){ if (busy){ pending = i; return; } run(i); }

function layoutNow(){
  measure(); setT(0);
  BOXES.forEach((_,i)=>{ const s = i===held ? liftState() : pileState(i); applyBox(i, s); setZ(i, s.z); });
  if (held !== null){ setClaw(clawFor(liftState(), LIFT_Y, false)); }
  else if (clawState){ setClaw({...clawState, x:Math.min(clawState.x, G.SW-40)}); }
  else { setClaw({x:G.SW/2, Y:HOME_Y, span:G.W*1.06, h:G.H, open:true}); }
}

document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.go)));
document.querySelector('.logo').addEventListener('click',e=>{e.preventDefault();pick(0);});
addEventListener('keydown',e=>{ if (e.key==='Escape') pick(0); });
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt = setTimeout(()=>{ if(!busy) layoutNow(); else setTimeout(layoutNow, 1200); }, 120); });

layoutNow();
setTimeout(()=>pick(0), 500);
window.__pick = pick;
})();
</script>
